spring:
  application:
    name: backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wendyapp}
    username: ${DATABASE_USER:wendyapp}
    password: ${DATABASE_PASSWORD:wendyapp}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

# JWT config
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-replace-with-32-or-more-random-bytes}
    # 7 days, in milliseconds (revisit per spec PRD §7)
    expiration-ms: 604800000

# CORS allowed origins (comma-separated). Vite dev server by default.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# springdoc-openapi (Swagger UI at /api/v1/swagger-ui.html)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Allowed ZIP codes (v1: Sequim only)
sequim:
  allowed-zips: 98382

logging:
  level:
    com.wendyapp.backend: DEBUG
