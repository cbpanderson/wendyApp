services:
  postgres:
    image: postgres:16
    container_name: wendyapp-postgres
    environment:
      POSTGRES_USER: wendyapp
      POSTGRES_PASSWORD: wendyapp
      POSTGRES_DB: wendyapp
    ports:
      - "5432:5432"
    volumes:
      - wendyapp-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wendyapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wendyapp-pg-data:
